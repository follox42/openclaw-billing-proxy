services:
  claude-bypass:
    build: .
    image: claude-bypass:latest
    container_name: claude-bypass
    restart: unless-stopped

    # PAS de bloc `ports:` — le service est uniquement accessible
    # depuis les reseaux Docker (default = project openclaw, coolify = principal Coolify).
    # Clients reachent via http://claude-bypass:18801 depuis n'importe lequel des deux reseaux.

    volumes:
      # Volume nomme pour persister les credentials OAuth
      # apres `docker exec -it claude-bypass claude auth login`
      - claude-creds:/root/.claude

      # Optional : config custom (toolRenames, replacements). Decommente si besoin.
      # - ./config.json:/app/config.json:ro

    environment:
      - PROXY_PORT=18801
      - PROXY_HOST=0.0.0.0  # bind interne au container — necessaire pour reachability inter-container
      # OAUTH_TOKEN volontairement omis — on utilise le volume + claude auth login

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://localhost:18801/health',
          r => process.exit(r.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - default
      - coolify

volumes:
  claude-creds:
    # Le volume nomme — Coolify le persiste automatiquement entre deploiements

networks:
  default:
    # Reseau du project Coolify openclaw — partage avec les autres services du meme project (openclaw, etc.).
  coolify:
    external: true
    name: coolify
    # Reseau principal Coolify — permet aux apps Dockerfile-mode (poker-coach, etc.)
    # d'atteindre claude-bypass via DNS Docker.
